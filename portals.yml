# ➤ ── SECTION 10: THE COUNCIL — SHADOW, OFF ────────────
# ➤ WHAT IT IS: a layer ON TOP OF the funnel. Three AI judges (The Good defender,
# ➤ The Bad prosecutor, The Ugly realist) rethink IN PROSE what Argus decided
# ➤ and record their verdict (2 of 3) in their own log data/judge-shadow.jsonl.
# ➤ It runs in SHADOW: it decides NOTHING, it touches neither this list nor the pipeline. It serves
# ➤ to MEASURE, at 2 weeks, whether it would improve the deterministic filter.
# ➤ HOW TO TURN IT ON: set enabled: true. While it's false (or this
# ➤ block is missing), the harness server-bot/argus-council/judge-shadow.mjs does nothing.
# ➤ PARAMETERS:
# ➤   · model         → model for ALL judges (empty = each judge uses its
# ➤                     own: The Good=haiku, The Bad/The Ugly=sonnet).
# ➤   · sample_dropped → how many DISCARDED (by title) to sample from
# ➤                      data/scan-explain.txt besides the presented ones.
council:
  # ➤ OFF by default: the Council is the only part that needs the Claude CLI
  # ➤ installed and logged in on this machine. Searching, filtering and Telegram
  # ➤ all work without it. Set to true once you have run: claude setup-token.
  enabled: false            # ➤ true = shadow mode (judges each scan; decides nothing)
  model: sonnet             # ➤ block's default model; empty = each judge's own
  sample_dropped: 0         # ➤ number of discarded to review per scan (0 = only the presented ones)
