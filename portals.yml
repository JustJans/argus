# ➤ ═══════════════════════════════════════════════════════════════════
# ➤ WHAT THIS FILE IS: the HEART of your job-search rules.
# ➤ This decides WHICH offers reach you and which don't. Sections:
# ➤   1. location_filter        → allowed and blocked locations
# ➤   2. adzuna                 → the portal aggregator (Indeed and others)
# ➤   3. linkedin               → LinkedIn search (minimal volume)
# ➤   4. title_language_filter  → accepted title languages (EN/ES/CA)
# ➤   5. experience_filter      → experience-years threshold (2)
# ➤   6. workday_search_terms   → words searched on Workday
# ➤   7. title_filter           → words that ADMIT or DISCARD a title
# ➤   8. company_filter         → company blacklist
# ➤   9. tracked_companies      → the companies scanned one by one
# ➤  10. council                → The Council (judges, shadow, off)
# ➤ After ANY change here: node server-bot/test-filter.mjs
# ➤ ═══════════════════════════════════════════════════════════════════
# Portal Scanner Configuration
