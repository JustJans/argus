# -- Adzuna aggregator --
# Free job API that indexes Indeed + many EU boards by country + keyword.
# Get app_id + app_key (free) at https://developer.adzuna.com/ and put them in
# server-bot/adzuna-key.json. Frugal by design: 1 request per country × keyword.
# Adzuna does NOT cover Norway or Denmark — those stay on Workday (Equinor etc).
# A country turned OFF in server-bot/countries.yml is skipped here too.

# ➤ ── SECTION 2: ADZUNA ───────────────────────────────────────────────
# ➤ Adzuna is an "aggregator": a search engine that already indexes Indeed and
# ➤ dozens of European portals. We ask it by country (ES/NL/BE/DE/FR) with
# ➤ the words in "queries". It's the source that brings the most offers.
adzuna:
  enabled: true
  max_days_old: 21          # only offers posted in the last N days
  results_per_page: 50
  sort_by: date             # newest first — pairs with frequent incremental scans
  countries:                # name must match countries.yml for the toggle to work
    - { name: Spain, code: es }
    - { name: Netherlands, code: nl }
    - { name: Belgium, code: be }
    - { name: Germany, code: de }
    - { name: France, code: fr }
    # ➤ Added 2026-07-11: Switzerland and Austria (Adzuna covers them and they
    # ➤ pay well). Monaco has no Adzuna of its own: its offers arrive via Adzuna
    # ➤ France, LinkedIn and the tracked companies (SBM is headquartered there).
    - { name: Switzerland, code: ch }
    - { name: Austria, code: at }
  # queries: what = exact phrase (AND of words), what_or = match ANY word.
  # Broad on purpose — the title_filter below does the precision filtering.
  # One call per query per country, per scan. Adding either multiplies the
  # calls, so keep an eye on the free tier.
  queries:
    # ➤ "orcaflex" added (2026-07-11): Adzuna searches ALL of the offer's
    # ➤ text, so this catches mentions of OrcaFlex in the body.
    - what_or: "offshore marine subsea mooring maritime naval orcaflex"
    # ➤ "survey geomatics bathymetric" added 2026-07-18 (the owner's literal BSc).
    # ➜ "landmeter" added 2026-07-28 (argus-discover / ESCO). Land surveying is
    # ➜ the one adjacency the taxonomy proposed that the market actually
    # ➜ advertises, and no other query asks for it. It is a TRIAL: if it never
    # ➜ produces an application, take this word and its two positives out.
    - what_or: "automation instrumentation robotics mechatronics GIS metocean oceanography hydrographic survey geomatics bathymetric landmeter"
    - what_or: "wind renewable hydrogen tidal"

# -- LinkedIn jobs-guest (adopted from MadsLorentzen/ai-job-search, MIT) --
# Public endpoints LinkedIn serves to logged-OUT visitors: no account, no
# cookies, works for any country. ToS caveat: LinkedIn disallows automated
# access — volume is kept MINIMAL (few queries, 1 page each, at most every
# `every_hours`, 24h self-cooldown on 429). Risk = home-IP rate-limit only;
# no account can be banned. Set enabled: false to switch off.

# ➤ ── SECTION 3: LINKEDIN ─────────────────────────────────────────────
# ➤ LinkedIn search WITHOUT an account (public pages). Deliberately at
# ➤ minimal volume: few queries, at most every 6 hours, and if
# ➤ LinkedIn complains (error 429), the bot stops itself for 24h.
linkedin:
  enabled: true
  every_hours: 6        # at most one LinkedIn pass every N hours
  max_age_days: 7       # only postings from the last N days
  queries:              # 1 request each, 10 results per query
    - { keywords: "offshore engineer", location: "Spain" }
    - { keywords: "marine engineer", location: "Netherlands" }
    - { keywords: "offshore wind engineer", location: "Belgium" }
    - { keywords: "automation engineer junior", location: "Barcelona, Spain" }
    # ➤ Added 2026-07-11: Monaco (they pay well; SBM is there) and
    # ➤ OrcaFlex across all of Europe (LinkedIn also searches in the body).
    - { keywords: "offshore engineer", location: "Monaco" }
    - { keywords: "OrcaFlex", location: "European Union" }
    - { keywords: "instrumentation engineer", location: "Spain" }
    - { keywords: "mooring engineer", location: "Netherlands" }

# -- Title language filter --
# The user's rule: a MANDATORY language they do not speak = discard; "nice to
# have" = fine. The scanner can't read JD bodies, but the TITLE language is
# a reliable proxy for the working language: German-titled postings require
# German. English-titled jobs in DE/FR/NL pass — those are the "can fit even
# if posted abroad" cases. Detection via the free translate endpoint; on
# detection failure the offer is kept.
# ➤ ── SECTION 4: TITLE LANGUAGE ────────────────────────────────────
# ➤ If the offer's title is in a language you don't speak (German,
# ➤ French...), out. English, Spanish and Catalan are accepted. The language
# ➤ of the offer's BODY is checked separately, inside the scan.
title_language_filter:
  enabled: true
  allow: [en, es, ca]

# -- Experience-years screen --
# Titles never carry the years required, so for every ADMITTED offer the
# scanner fetches the body and reads the demanded years of experience
# (extractRequiredYears, EN/ES/CA/FR/DE/NL — a number counts ONLY when an
# "experience" word is right next to it; company boasts like "20 years of
# combined experience" are guarded out). Offers requiring MORE than
# max_years are dropped before they reach the Telegram list. The user has < 2
# years of real experience; max_years: 2 (lowered from 3 on 2026-07-10, the owner's
# call after rejecting several 3-year asks) keeps 0-2-year offers and drops
# 3+. Offers whose body doesn't state a clear requirement are KEPT (never
# lose an offer to a parse miss). Disable: enabled: false or --no-expcheck.
# ➤ ── SECTION 5: EXPERIENCE YEARS ──────────────────────────────────
# ➤ The bot READS the whole offer and extracts how many years it asks for. With max_years: 2,
# ➤ anything asking for 3 or more years is discarded. If the offer doesn't state years,
# ➤ it's kept (better to show you one too many than lose a good one).
experience_filter:
  enabled: true
  max_years: 2

# -- Workday search terms --
# For Workday-based companies, the scanner queries each of these terms
# server-side (then applies the title_filter below locally). Keeps requests
# targeted instead of pulling thousands of unrelated jobs.

# ➤ ── SECTION 6: WORDS FOR WORKDAY ────────────────────────────────
# ➤ Workday is the job portal used by Shell, Equinor, Fugro, etc.
# ➤ These words are searched at each company so as not to download thousands of
# ➤ irrelevant offers (only what sounds like your field).
workday_search_terms:
  - "offshore"
  - "marine"
  - "mooring"
  - "subsea"
  - "naval"
  - "wind"
  - "renewable"
  - "graduate"
  - "ocean"
  - "floating"
  - "automation"
  - "instrumentation"
  - "survey"
  # ➤ Workday searches the FULL TEXT of the offer, not just the title —
  # ➤ so "orcaflex" catches offers that ask for it in the body (2026-07-11).
  - "orcaflex"

# -- Title filter --
# Marine / Offshore / Ocean / Coastal / Aquaculture keywords

# ➤ ── SECTION 7: THE TITLE FILTER (the most important) ─────────────
# ➤ It works in two steps:
# ➤   1st the title must contain some POSITIVE word (if not, out)
# ➤   2nd if it contains any NEGATIVE one, out even if it had a positive
# ➤ Your rules embodied here: out degrees you don't have (electrical,
# ➤ mechanical, civil...), out robotics/software/non-marine consultants,
# ➤ out senior and trade roles. Each term carries its reason beside it.
title_filter:
  # ➤ WORDS THAT ADMIT an offer (one is enough): your real field.
  positive:
    # -- Core offshore/marine roles --
    - "Mooring"
    - "Offshore"
    - "Marine"
    - "Naval"
    - "Ocean"
    - "Coastal"
    - "Subsea"
    - "Floating"
    - "FPSO"
    - "FLNG"
    - "Riser"
    - "Umbilical"
    - "Seabed"
    - "Nearshore"
    # -- Offshore energy --
    # (no bare "Energy": it matched policy/strategy/support roles in production)
    - "Offshore Wind"
    - "Wind Energy"
    - "Renewable Energy"
    - "Energy Systems"
    # ➤ ("Energy Engineer" removed from positives on 2026-07-13: #49 —
    # ➤ "it's a specific degree" the owner does not have; now it's NEGATIVE, see below.)
    - "Offshore Energy"
    - "Tidal"
    - "Wave Energy"
    - "Hydrogen"
    # ➤ OrcaFlex (2026-07-11): the mooring-engineering software the owner
    # ➤ masters — "hardly anyone knows it"; if a title mentions it, in.
    - "OrcaFlex"
    # Offshore wind cable engineering (export/array/submarine cables)
    - "Export Cable"
    - "Array Cable"
    - "Submarine Cable"
    # -- Engineering roles --
    - "Structural Engineer"
    - "Project Engineer"
    - "Design Engineer"
    - "Simulation Engineer"
    - "Analysis Engineer"
    - "Field Engineer"
    - "Installation Engineer"
    - "Commissioning Engineer"
    # -- Data/GIS/modelling --
    - "GIS"
    - "Oceanograph"
    - "Oceanograf"
    - "Environmental Engineer"
    - "Hydrograph"
    - "Marine Scientist"
    - "Metocean"
    - "Met-Ocean"
    # ➤ Survey (2026-07-18, approved exploration): the user's literal degree!
    # ➤ "Survey Engineer" was being blocked for not having a word from the owner's field, even
    # ➤ though Fugro's note flags it as a direct match for a marine-survey background.
    # ➤ Verified without noise: Quantity/Land Surveyor and Employee Survey remain
    # ➤ blocked (they don't contain "survey engineer" and the negatives act).
    - "Survey Engineer"
    - "Geomatics"
    - "Bathymetric"
    # ("Data Analyst" removed 2026-07-10: 8 rejections "I'm not and don't want to be" —
    #  GIS/marine-data roles still enter via GIS/Marine/Oceanograph positives)
    # -- Automation / instrumentation (broadened spectrum: the user has Python,
